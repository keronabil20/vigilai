services:
  postgres:
    image: postgres:16-alpine
    container_name: vigilai-postgres
    environment:
      POSTGRES_USER: vigilai
      POSTGRES_PASSWORD: vigilai
      POSTGRES_DB: vigilai
    ports:
      - "5433:5432"
    volumes:
      - vigilai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilai -d vigilai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vigilai-redis
    ports:
      - "6399:6379"
    volumes:
      - vigilai_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vigilai_pg:
  vigilai_redis:
